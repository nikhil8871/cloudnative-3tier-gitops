name: Infrastructure CI (Terraform)

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform_files/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform_files/**'

jobs:
  terraform:
    name: Lint & Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Check Formatting
        run: terraform -chdir=terraform_files fmt -check

      - name: Terraform Init
        run: terraform -chdir=terraform_files init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform_files validate
