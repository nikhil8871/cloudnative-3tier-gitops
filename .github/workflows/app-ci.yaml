name: Application CI (Docker & Services)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Docker-Compose.yml'
      - '.github/workflows/app-ci.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Docker-Compose.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Validate Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate Backend Dependencies
        run: |
          cd backend
          npm ci --prefer-offline --no-audit || npm install
          echo "Backend dependencies verified."

      - name: Validate Frontend Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit || npm install
          echo "Frontend dependencies verified."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            nikhil8871/3-tier-backend:${{ github.sha }}
            nikhil8871/3-tier-backend:v1
            nikhil8871/3-tier-backend:latest

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            nikhil8871/3-tier-frontend:${{ github.sha }}
            nikhil8871/3-tier-frontend:v1
            nikhil8871/3-tier-frontend:latest